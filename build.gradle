plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = "https://maven.shedaniel.me/" }

    //maven { url = "https://cursemaven.com" }
	maven { url = "https://maven.terraformersmc.com/" }
	mavenCentral()

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	//modImplementation("vectorwing:FarmersDelight:${fdrf_version}") {
	//	exclude(group: "net.fabricmc")//农夫乐事 重织的依赖
	//}
	modImplementation "com.terraformersmc.terraform-api:terraform-wood-api-v1:11.0.0"
	modImplementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
	// Let's Do (farm_and_charm/candlelight) 运行时依赖的配置库
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.140"

	// Let's Do 系列前置
	implementation "blue.endless:jankson:1.2.1"

	modImplementation files(
		'libs/letsdo-API-fabric-1.3.0-beta-release-fabric.jar',
		'libs/letsdo-farm_and_charm-fabric-1.1.23.jar',
		'libs/letsdo-candlelight-fabric-2.1.12.jar',
		'libs/architectury-13.0.11-fabric.jar'
	)



}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

sourceSets {
	main {
		resources {
			srcDirs += [
				'src/main/generated'
			]
			exclude '.cache'
		}
	}
}

tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('runDatagen') {
	doLast {
		fileTree(dir: 'src/main/generated/data/wildernesss-delight/advancements', include: '**/*.json').each { f ->
			def text = f.text
			def cleaned = text.replaceAll(',?\\s*"sends_telemetry_event": true,?\\s*', '')
			if (cleaned != text) {
				f.text = cleaned
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

tasks.named('sourcesJar') {
	dependsOn tasks.named('runDatagen')
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
